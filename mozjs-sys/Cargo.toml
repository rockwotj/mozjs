[package]
name = "mozjs_sys"
description = "System crate for the Mozilla SpiderMonkey JavaScript engine."
repository.workspace = true
version = "153.4.0-0"
authors = ["Mozilla", "The Servo Project Developers"]
links = "mozjs"
license.workspace = true
exclude = ["__pycache__", "/etc/", "/mozjs/.cargo/"]
edition.workspace = true

[lib]
name = "mozjs_sys"
# The generated jsapi.rs contains #[doc] strings which look like
# doctests but are definitely not.
doctest = false

[features]
debugmozjs = []
profilemozjs = []
jit = []
jitspew = []
libz-sys = ["dep:libz-sys"]
libz-rs = ["dep:libz-rs-sys"]
crown = []
oom_with_hook = []

[dependencies]
libc.workspace = true

# In SM these dependencies provided via jsrust_shared crate
# https://github.com/mozilla-firefox/firefox/blob/main/js/src/rust/shared/Cargo.toml
# which links to SM.
# Cargo does not allow recursive invocations so we link to them from here.

encoding_c = "0.9.8"
encoding_c_mem = "0.2.6"
# SpiderMonkey is built without the Intl API, so ICU4X is only used through the normalizer
# glue, for String.prototype.normalize.
mozjs_normalizer_glue = { version = "=153.4.0", path = "../mozjs-extracted-crates/normalizer_glue" }

libz-rs-sys = { version = "0.6", features = [
  "export-symbols",
], optional = true }
libz-sys = { version = "1.1.19", default-features = false, features = [
  "libc",
  "stock-zlib",
], optional = true }

[build-dependencies]
bindgen.workspace = true
cc.workspace = true
walkdir = "2"
flate2 = "1"
tar = "0.4"
